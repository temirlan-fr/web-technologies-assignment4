<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-success bg-opacity-10">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="bg-white p-4 rounded-4 shadow-sm">
                    <h1 class="text-success fw-bold mb-2">Contact us</h1>
                    <p class="text-secondary mb-4">Have a question? Leave us a message.</p>

                    <form>
                        <div class="row g-4">
                            <div class="col-12 col-md-6">
                                <label for="name" class="form-label fw-bold">Name</label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="Your name" aria-describedby="nameHelp" required minlength="2" maxlength="50">
                                <div id="nameHelp" class="form-text">Use 2–50 characters.</div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label fw-bold">Email</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" aria-describedby="emailHelp" required maxlength="100">
                                <div id="emailHelp" class="form-text">Enter a valid email address.</div>
                            </div>

                            <div class="col-12">
                                <label for="message" class="form-label fw-bold">Message</label>
                                <textarea id="message" name="message" class="form-control" rows="5" placeholder="Write your message here..." aria-describedby="messageHelp" required minlength="10" maxlength="500"></textarea>
                                <div id="messageHelp" class="form-text">Use 10–500 characters.</div>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-success w-100 py-2">Send message</button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
